packages:
  - packages/*

allowBuilds:
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  utf-8-validate: true

catalog:
  typescript: ^5.5.0
  viem: ^2.21.0
  zod: ^4.0.0
  "@types/node": ^22.0.0
  eslint: ^9.0.0
  typescript-eslint: ^8.0.0
  tsx: ^4.19.0

minimumReleaseAgeExclude:
  - '@x402/core@2.21.0'
  - '@x402/evm@2.21.0'
  - '@x402/express@2.21.0'
  - '@x402/extensions@2.21.0'
  - '@x402/fetch@2.21.0'

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
