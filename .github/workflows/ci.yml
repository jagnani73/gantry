name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Without this the token inherits the repository default, which is
# write on older repos -- enough to push commits or move tags. Nothing here
# needs to write anything back, and the repo is about to be public, where
# anyone can open the pull requests that run this file.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls a third-party action's repo can retarget v4 at new code, which
      # then runs here with our token. The trailing comment is the version the
      # SHA was resolved from -- update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # forge-std only. `--recursive` is a no-op today (forge-std has no
          # submodules of its own and OpenZeppelin left .gitmodules when it moved
          # to npm), but plain `true` states the actual requirement.
          submodules: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # OpenZeppelin comes from npm, so this MUST run before forge build/test
      # or the OZ imports will not resolve.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @gantry/shared test
      - run: pnpm --filter @gantry/backend test
      # Hermetic: a mock gateway on an ephemeral port, and GANTRY_API pinned at
      # a closed one so the money path is unreachable rather than merely unused.
      - run: pnpm --filter @gantry/agent test

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      # Fork tests self-skip without BASE_SEPOLIA_RPC_URL, so this stays green
      # without a secret; the rest run.
      - run: pnpm test:contracts

      # Static analysis. pipx rather than `pip install`, because the runner's
      # Python is externally managed (PEP 668) and a bare pip install fails
      # there; pipx ships on the image, so this adds no third-party action to
      # pin. Pinned exactly: a new Slither minor can add detectors, and a green
      # gate that starts failing on someone else's release is a gate people
      # switch off.
      #
      # It must run AFTER foundry-toolchain and `pnpm install`: Slither drives
      # `forge build`, and OpenZeppelin comes from npm.
      #
      # Seven detectors are excluded in packages/contracts/slither.config.json,
      # each answered in docs/security/slither.md. This step therefore gates
      # everything ELSE — it is a regression check over the detectors we have
      # not already triaged, not a claim the contracts are bug-free.
      - run: pipx install slither-analyzer==0.11.6
      - run: slither .
        working-directory: packages/contracts

